---
title: "Home"
layout: "home"
---

<!DOCTYPE html>
<html>
    <head>
        <title>{{page.title}} | {{ site.title }}</title>
        <meta name="og:title" content="{{ page.title }}">
        <meta name="og:site_name" content="{{ site.title }}">
        <meta name="theme-color" content="{{ site.color }}"/>
        <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1">
        <link rel="icon" type="image/png" href="/assets/images/site/favicon.png">
        <meta charset="UTF-8">
        
        <link rel="stylesheet" type="text/css" href="/assets/styles/default.css">
        <link rel="stylesheet" type="text/css" href="/assets/styles/{{ page.layout }}.css">
    </head>
    <body>
        <div id="container">
            <div id="window">
                <div id="titlebar">
                    <span id="titlebar-title">{{page.title}}</span>
                    <span id="titlebar-logo"></span>
                    <span id="titlebar-os">rOS v1.3</span>
                </div>
                <div id="content">
                    {{ content }}
                </div>
            </div>
        </div>
    </body>
</html>
