---
layout: default
---

<div id="bio">
    <div id="bio-avatar"></div>
    <div id="bio-logo"></div>
    <div id="bio-description">
        {{ content }}
    </div>
</div>
<div id="socials">
    {% for social in site.socials %}
    <a class="social" style="{{ social.style }} --social-logo-url: url('../images/socials/{{social.logo}}')" href="{{ social.url }}">{{ social.name }}</a>
    {% endfor %}
</div>
